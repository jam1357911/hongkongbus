<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>香港巴士到站時間</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--panel-bg:#fff;--border:#e5e4e7;--card-muted:rgba(244,243,236,0.6);--text:#6b6375;--text-h:#08060d;--accent:#aa3bff;--accent-bg:rgba(170,59,255,0.1);--accent-border:rgba(170,59,255,0.5);--input-bg:#fff;--shadow:rgba(0,0,0,0.08)0 4px 12px}
@media(prefers-color-scheme:dark){
:root{--panel-bg:#16171d;--border:#2e303a;--card-muted:rgba(47,48,58,0.5);--text:#9ca3af;--text-h:#f3f4f6;--accent:#c084fc;--accent-bg:rgba(192,132,252,0.15);--accent-border:rgba(192,132,252,0.5);--input-bg:#1f2028;--shadow:rgba(0,0,0,0.4)0 4px 12px}}
body{font:16px/1.45 system-ui,sans-serif;background:var(--panel-bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100svh}
#root{display:flex;flex-direction:column;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
.board-panel,.builder-panel{background:var(--panel-bg);border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.board-panel{order:0}.builder-panel{order:2}
.tabs-bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tab-list{display:flex;gap:8px;flex-wrap:wrap}
.tab-button{border:1px solid transparent;background:var(--card-muted);color:var(--text-h);padding:10px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:20px;font-weight:600}
.tab-button.active,.tab-button:hover{border-color:var(--accent);background:var(--accent-bg)}
.tab-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tab-stations{color:#e53935;font-size:13px;font-weight:600;line-height:1.4}
.tab-meta{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:16px}
.tab-meta .field{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:14px;font-weight:700;color:var(--text-h)}
.field input,.section-title input{width:100%;border:1px solid var(--border);border-radius:14px;background:var(--input-bg);color:var(--text-h);padding:10px 14px;font:inherit;font-size:14px}
.panel-header{margin-bottom:16px}
.panel-header h2{font-size:18px;color:var(--text-h)}
.panel-header p{font-size:14px}
.secondary-button{background:var(--card-muted);color:var(--text-h);border:1px solid transparent;padding:10px 14px;border-radius:14px;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.secondary-button:hover{border-color:var(--accent-border)}
.secondary-button:disabled{opacity:.5;cursor:not-allowed}
.fastest-panel{margin-bottom:0}
.fastest-panel-header h3{font-size:15px;color:var(--text-h);font-weight:700;margin:0 0 4px}
.fastest-panel-header p{font-size:13px;color:var(--text)}
.fastest-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.fastest-card{background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.fastest-rank{font-size:17px;font-weight:700;color:var(--accent)}
.fastest-card strong{font-size:26px;color:var(--text-h)}
.fastest-card span{font-size:18px;color:var(--text-h)}
.fastest-card small{font-size:17px;color:var(--text);font-weight:700}
.favourite-grid{display:grid;gap:12px;margin-top:32px}
.eta-card{border:1px solid var(--border);border-radius:20px;padding:16px;background:#c62828}
.eta-card-header{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:12px}
.badge-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.route-badge{display:inline-flex;align-items:center;background:var(--accent-bg);color:#fff;padding:8px 12px;border-radius:999px}
.route-badge-text{font-size:26px;line-height:1;font-weight:800}
.operator-badge{display:inline-flex;align-items:center;background:rgba(255,255,255,.18);color:#fff6f6;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700}
.eta-card h3{font-size:17px;font-weight:700;color:#fff6f6;margin-bottom:4px}
.eta-card p,.eta-card .muted,.eta-card .eta-footer,.eta-card .eta-row span,.eta-card .eta-row small{color:#fff6f6}
.eta-card-actions{display:flex;gap:8px;flex-shrink:0}
.icon-button{background:rgba(255,255,255,.16);color:#fff;border:1px solid transparent;padding:8px 12px;border-radius:12px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;white-space:nowrap}
.icon-button:hover{border-color:rgba(255,255,255,.55)}
.eta-list{display:grid;gap:8px}
.eta-row{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.16)}
.eta-row div{display:flex;flex-direction:column;gap:2px}
.eta-row strong{font-size:18px;color:#fff;font-weight:800}
.eta-row span{font-size:14px}.eta-row small{font-size:13px;color:var(--text)}
.eta-footer{margin-top:12px;font-size:13px;opacity:.85}
.empty-card{padding:32px;border-radius:20px;border:1px dashed var(--border);background:var(--card-muted);text-align:center}
.empty-card h3{font-size:16px;color:var(--text-h);margin-bottom:8px}
.empty-card p{font-size:14px;color:var(--text)}
.section-block{margin-bottom:16px}
.section-block h3{font-size:15px;font-weight:700;color:var(--text-h);margin-bottom:8px}
.section-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}
.section-title h3{font-size:15px;font-weight:700;color:var(--text-h);margin:0}
.section-title input{max-width:200px}
.result-list,.choice-list,.stop-list{display:grid;gap:8px;max-height:300px;overflow:auto}
.result-card,.choice-chip,.stop-row{text-align:left;background:var(--card-muted);color:var(--text-h);border-radius:14px;padding:12px;border:1px solid transparent;cursor:pointer;font:inherit}
.result-card:hover,.choice-chip:hover,.stop-row:hover{border-color:var(--accent-border)}
.result-card.selected,.choice-chip.selected,.stop-row.selected{border-color:var(--accent);background:var(--accent-bg)}
.result-card strong,.choice-chip strong{display:block;font-size:15px;margin-bottom:4px}
.result-card span,.choice-chip span,.stop-name{font-size:13px;color:var(--text)}
.stop-row{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center}
.stop-seq{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,.55);color:var(--text-h);font-weight:700;font-size:13px}
.muted{font-size:14px;color:var(--text)}
.error-text{font-size:14px;color:#dc2626}
.primary-button{width:100%;background:linear-gradient(135deg,var(--accent),#4f46e5);color:#fff;border:none;padding:12px 18px;border-radius:14px;cursor:pointer;font:inherit;font-size:15px;font-weight:700}
.primary-button:hover{opacity:.92}
.primary-button:disabled{opacity:.5;cursor:not-allowed}
/* 天气组件样式 */
.weather-panel{background:var(--panel-bg);border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:var(--shadow);order:3;max-width:100%;box-sizing:border-box}
.weather-header{margin-bottom:16px}
.weather-title{font-size:18px;color:var(--text-h);margin-bottom:4px}
.weather-subtitle{font-size:14px;color:var(--text)}
.weather-grid{display:grid;gap:12px;max-width:100%;box-sizing:border-box}
/* 24小时天气 */
.hourly-weather{display:grid;grid-template-columns:repeat(auto-fit, minmax(60px, 1fr));gap:4px;max-width:100%;box-sizing:border-box}
.hourly-item{background:var(--card-muted);border:1px solid var(--border);border-radius:12px;padding:6px;text-align:center;box-sizing:border-box}
.hourly-time{font-size:11px;color:var(--text-h);font-weight:600;margin-bottom:2px}
.hourly-temp{font-size:13px;color:var(--text-h);font-weight:700;margin-bottom:2px}
.hourly-icon{font-size:18px;margin-bottom:2px}
.hourly-rain{font-size:9px;color:var(--text)}
/* 5天天气 */
.daily-weather{display:grid;gap:8px}
.daily-item{background:var(--card-muted);border:1px solid var(--border);border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center}
.daily-date{font-size:14px;color:var(--text-h);font-weight:600}
.daily-icon{font-size:28px}
.daily-temp{font-size:16px;color:var(--text-h);font-weight:700}
.daily-rain{font-size:14px;color:var(--text)}
@media(min-width:768px){
  .fastest-grid{grid-template-columns:repeat(3,1fr)}
  .hourly-weather{grid-template-columns:repeat(auto-fit, minmax(80px, 1fr))}
  .hourly-time{font-size:12px}
  .hourly-temp{font-size:14px}
  .hourly-icon{font-size:20px}
  .hourly-rain{font-size:10px}
  .daily-item{grid-template-columns:1fr auto auto auto}
}
/* ===== 轉乘組合 transfer combo ===== */
.mode-toggle{display:flex;gap:8px;margin-bottom:14px}
.mode-btn{flex:1;padding:10px 14px;border-radius:14px;border:1px solid var(--border);background:var(--card-muted);color:var(--text-h);font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.mode-btn.active{border-color:var(--accent);background:var(--accent-bg)}
.picker-block{border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px;background:var(--card-muted)}
.picker-heading h3{font-size:16px;color:var(--text-h);margin-bottom:4px}
.picker-heading p{font-size:13px;margin-bottom:10px}
.transfer-pickers{display:grid;gap:12px}
.match-toggle{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px;color:var(--text-h);cursor:pointer;flex-wrap:wrap}
.same-stop-tag{display:inline-block;margin-left:6px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border);border-radius:999px;padding:0 8px;font-size:11px;font-style:normal;font-weight:700}
.transfer-status{margin:12px 0;font-size:14px;color:var(--text-h);font-weight:600}
.transfer-section{margin-top:32px}
.transfer-section-header{margin-bottom:12px}
.transfer-section-header h3{font-size:18px;color:var(--text-h);margin-bottom:4px}
.transfer-section-header p{font-size:13px}
.transfer-grid{display:grid;gap:12px}
.transfer-card{border:1px solid var(--border);border-radius:20px;padding:12px 14px;background:linear-gradient(135deg,#12235c,#1e3a8a 55%,#312e81)}
.transfer-heading h3{font-size:17px;font-weight:700;color:#fff6f6;margin:8px 0 2px}
.transfer-direction{font-size:13px;color:#dfe3ff;margin-bottom:10px}
.transfer-badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.transfer-route-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;color:#fff}
.transfer-route-badge b{font-size:20px;line-height:1}
.transfer-route-a{background:rgba(59,130,246,.5)}
.transfer-route-b{background:rgba(34,197,94,.5)}
.transfer-arrow{font-size:13px;color:#dfe3ff;font-weight:700;white-space:nowrap}
.transfer-list{display:grid;gap:8px}
.transfer-row{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.14)}
.transfer-leg-col{flex:0 0 auto;min-width:52px;display:flex;align-items:center}
.transfer-mid-col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:13px;color:#dfe3ff}
.transfer-mid-col .transfer-dest{font-size:14px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transfer-mid-col small{font-size:12px;color:#c9cdf0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg-pill{display:inline-block;border-radius:12px;padding:4px 12px;font-size:16px;line-height:1.15;font-weight:800;color:#fff;white-space:nowrap}
.leg-pill-a{background:#2563eb}
.leg-pill-b{background:#16a34a}
.transfer-time-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;align-self:stretch;gap:2px;text-align:right}
.transfer-time-main{display:flex;align-items:baseline;gap:7px;justify-content:flex-end}
.transfer-time-main strong{font-size:23px;color:#fff;font-weight:800;line-height:1.1}
.transfer-time-main span{font-size:17px;color:#fff;font-weight:600}
.gap-badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;line-height:1.5}
.gap-badge-value{background:rgba(251,191,36,.28);color:#ffd76a}

.transfer-footer{margin-top:8px;font-size:13px;opacity:.85;color:#fff6f6}
.transfer-card .error-text{color:#ffb4b4}
.transfer-card .muted{color:#dfe3ff}
@media(max-width:560px){.transfer-row{flex-wrap:nowrap;gap:6px 8px}.transfer-mid-col{flex:1 1 auto;min-width:0}.transfer-time-side{margin-left:auto;align-items:flex-end}}</style>
</head>
<body>
<div id="root">
  <div class="app-title">
  <h1>香港巴士實時到站時間</h1>
  <p class="subtitle">獲取九巴、城巴的實時到站數據</p>
</div>
<div class="board-panel" id="board">
<div class="tabs-bar" id="tabs-bar"></div>
<div class="tab-meta">
<label class="field"><span>分頁名稱</span><input id="tab-name"></label>
<button type="button" class="secondary-button" id="rename-btn">重新命名</button>
<p class="muted">資料保存在瀏覽器本機。</p>
</div>
<div id="fastest-panel" style="display:none">
<div class="fastest-panel-header"><h3>最快到站 3 條路線</h3><p>根據這個分頁每個站的首班 ETA 排序</p></div>
<div class="fastest-grid" id="fastest-grid"></div>
</div>
<div class="favourite-grid" id="favourite-grid"></div>
<div class="transfer-section" id="transfer-section" style="display:none">
<div class="transfer-section-header"><h3>轉乘組合</h3><p>合併兩程各 3 班到站時間，並顯示第二程每班與上一班(第一程)相差多少分鐘。</p></div>
<div class="transfer-grid" id="transfer-grid"></div>
</div>
</div>
<div class="builder-panel" id="builder">
<div class="panel-header"><h2>加入站點</h2><p>揀路線、方向與站點，或加入轉乘組合。</p></div>
<div class="mode-toggle">
<button type="button" class="mode-btn active" id="mode-stop-btn">加入站點</button>
<button type="button" class="mode-btn" id="mode-transfer-btn">加入轉乘</button>
</div>
<div id="stop-mode">
<div class="section-block">
<h3 style="font-size:15px;font-weight:700;color:var(--text-h);margin-bottom:8px">批量加入：搜尋車站（九巴）</h3>
<input id="bulk-stop-search" placeholder="例如 尖沙咀碼頭" style="width:100%;border:1px solid var(--border);border-radius:14px;background:var(--input-bg);color:var(--text-h);padding:10px 14px;font:inherit;font-size:14px;margin-bottom:8px;box-sizing:border-box">
<div class="stop-list" id="bulk-stop-results" style="max-height:200px"></div>
<button type="button" class="primary-button" id="bulk-add-btn" style="display:none;margin-top:8px">加入所有路線</button>
</div>
<label class="field"><span>搜尋路線</span><input id="route-search" placeholder="例如 1A、970、機場"></label>
<div class="result-list" id="result-list"></div>
<div class="section-block" id="dir-block" style="display:none"><h3>方向</h3><div class="choice-list" id="dir-list"></div></div>
<div class="section-block" id="stop-block" style="display:none">
<div class="section-title"><h3>站點</h3><input id="stop-filter" placeholder="過濾站點"></div>
<div class="stop-list" id="stop-list"></div>
</div>
<button type="button" class="primary-button" id="add-btn" disabled>加入目前分頁</button>
</div>
<div id="transfer-mode" style="display:none">
<div class="transfer-pickers" id="transfer-pickers"></div>
<div class="transfer-status" id="transfer-status"></div>
<button type="button" class="primary-button" id="add-transfer-btn" disabled>加入轉乘組合到目前分頁</button>
</div>
</div><div class="weather-panel" id="weather-panel">
<div class="weather-header">
  <h2 class="weather-title">天氣預報</h2>
  <p class="weather-subtitle">香港天文台數據</p>
</div>
<div class="weather-grid">
  <div id="hourly-weather"></div>
  <div id="daily-weather"></div>
  <div style="margin-top: 10px;">
    <button type="button" class="primary-button" id="load-weather-btn" style="margin-top: 10px;">重新載入天氣數據</button>
  </div>
</div>
</div>

<script>
(function(){
var M={tabs:[],activeTabId:'',collapsed:{},selectedRoute:null,selectedDir:null,stops:[],selectedStopId:'',etaMap:{},trEta:{}}

function el(t,c){
  var e=document.createElement(t)
  if(c)for(var k in c){var v=c[k];if(k==='cls')e.className=v;else if(k==='ev')for(var en in v)e.addEventListener(en,v[en]);else e[k]=v}
  for(var i=2;i<arguments.length;i++){var ch=arguments[i];if(typeof ch==='string'||typeof ch==='number')e.textContent=ch;else if(ch&&ch.nodeType)e.appendChild(ch);else if(ch&&ch.length)for(var j=0;j<ch.length;j++)e.appendChild(ch[j])}
  return e
}

function uid(){return 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)}
function defTab(i){return{id:uid(),name:'分頁 '+i,favourites:[],transfers:[]}}
function fmt(eta){if(!eta)return'--';var m=Math.round((new Date(eta).getTime()-Date.now())/60000);return m<=0?'即將到站':m+' 分鐘'}
function fk(f){return f.op+':'+f.rt+':'+f.dir+':'+f.stype+':'+f.sid}
function dc(d){return d==='outbound'?'O':'I'}
function bt(b){return b==='O'?'outbound':'inbound'}

function gt(u,cb){
  fetch(u,{headers:{accept:'application/json'}})
    .then(function(r){if(!r.ok)throw Error('ERR'+r.status);return r.json()})
    .then(function(d){cb(null,d)})
    .catch(function(e){cb(e,null)})
}
function gs(u,cb){
  fetch(u,{headers:{accept:'application/json'}})
    .then(function(r){if(!r.ok){cb(null,null);return}return r.json()})
    .then(function(d){cb(null,d)})
    .catch(function(e){cb(null,null)})
}

var Q=document.getElementById.bind(document)

var mr=Q('result-list'),md=Q('dir-block'),mdr=Q('dir-list'),ms=Q('stop-block'),mst=Q('stop-list'),mab=Q('add-btn'),msf=Q('stop-filter')
var mtb=Q('tabs-bar'),mtn=Q('tab-name'),mfg=Q('favourite-grid'),mfp=Q('fastest-panel'),mfgg=Q('fastest-grid'),mrb=Q('rename-btn')
 var bs=Q('bulk-stop-search'),brs=Q('bulk-stop-results'),bab=Q('bulk-add-btn')

// 天气数据获取函数
function getWeatherData(cb){
  // 使用香港天文台的天气API
  var url='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc'
  console.log('開始獲取天氣數據:', url)
  fetch(url,{headers:{accept:'application/json'}})
    .then(function(r){
      console.log('响应状态:', r.status, r.statusText)
      if(!r.ok)throw Error('ERR'+r.status+' - '+r.statusText)
      return r.json()
    })
    .then(function(d){
      console.log('獲取天氣數據成功:', d)
      cb(null,d)
    })
    .catch(function(e){
      console.error('獲取天氣數據失敗:', e)
      cb(e,null)
    })
}

// 天气图标映射
function getWeatherIcon(wx){
  var icons={
    '晴朗':'☀️','多云':'☁️','有云':'⛅','阴天':'☁️','有雨':'🌧️','雷暴':'⛈️','雨':'🌧️','毛毛雨':'🌦️','骤雨':'🌧️','雷雨':'⛈️','雪':'❄️'
  }
  for(var key in icons){
    if(wx.indexOf(key)!==-1)return icons[key]
  }
  return '🌤️'
}

// 渲染24小时天气（API不提供逐小时数据，显示今天的详细天气）
function renderHourlyWeather(data,mhw){
  console.log('=== renderHourlyWeather 被调用 ===')
  console.log('传入的数据:', data)
  console.log('传入的 mhw:', mhw)
  
  if(!data||!data.weatherForecast||data.weatherForecast.length===0||!mhw){
    console.log('条件不满足，返回')
    return
  }
  
  var todayForecast=data.weatherForecast[0]
  mhw.innerHTML=''
  
  // 创建控制按钮
  var toggleBtn=el('button',{
    type:'button',
    cls:'secondary-button',
    style:'margin-bottom:8px;font-size:12px;padding:6px 10px',
    ev:{
      click:function(){
        // 切换显示/隐藏状态
        var items=document.querySelectorAll('#hourly-weather .hourly-item')
        items.forEach(function(item,index){
          if(index>=8){
            item.style.display=item.style.display==='none'?'block':'none'
          }
        })
        // 更改按钮文字
        this.textContent=this.textContent==='顯示更多'?'收起':'顯示更多'
      }
    }
  },'顯示更多')
  
  var grid=el('div',{cls:'hourly-weather'})
  
  // 创建24个小时时间段
  var now=new Date()
  var currentHour=now.getHours()
  for(var i=currentHour;i<currentHour+24;i++){
    var hour=i%24
    var timeStr=(hour<10?'0':'')+hour+':00'
    
    // 转换PSR（显著降雨概率）为百分比数值
    var psrText=''
    switch(todayForecast.PSR){
      case '高': psrText='≥70%降雨'; break;
      case '中高': psrText='55-69%降雨'; break;
      case '中': psrText='45-54%降雨'; break;
      case '中低': psrText='30-44%降雨'; break;
      case '低': psrText='<30%降雨'; break;
      default: psrText='--%降雨'; break;
    }
    
    // 显示今天的天气信息
    var item=el('div',{cls:'hourly-item',style:i>=currentHour+8?'display:none':''},
      el('div',{cls:'hourly-time'},timeStr),
      el('div',{cls:'hourly-icon'},getWeatherIcon(todayForecast.forecastWeather)),
      el('div',{cls:'hourly-temp'},todayForecast.forecastMaxtemp.value+'°'),
      el('div',{cls:'hourly-rain'},psrText)
    )
    grid.appendChild(item)
  }
  
  mhw.appendChild(toggleBtn)
  mhw.appendChild(grid)
}

// 渲染5天天气
function renderDailyWeather(data,mdw){
  if(!data||!data.weatherForecast||!mdw)return
  var daily=data.weatherForecast.slice(0,5)
  mdw.innerHTML=''
  var grid=el('div',{cls:'daily-weather'})
  daily.forEach(function(d){
    // 解析日期格式：YYYYMMDD -> Date
    var year=parseInt(d.forecastDate.substring(0,4))
    var month=parseInt(d.forecastDate.substring(4,6))-1 // 月份从0开始
    var day=parseInt(d.forecastDate.substring(6,8))
    var dateStr=new Date(year,month,day).toLocaleDateString('zh-HK',{month:'short',day:'numeric',weekday:'short'})
    // 转换PSR（显著降雨概率）为百分比数值
    var psrText=''
    switch(d.PSR){
      case '高': psrText='≥70%降雨'; break;
      case '中高': psrText='55-69%降雨'; break;
      case '中': psrText='45-54%降雨'; break;
      case '中低': psrText='30-44%降雨'; break;
      case '低': psrText='<30%降雨'; break;
      default: psrText='--%降雨'; break;
    }
    
    var item=el('div',{cls:'daily-item'},
      el('div',{cls:'daily-date'},dateStr),
      el('div',{cls:'daily-icon'},getWeatherIcon(d.forecastWeather)),
      el('div',{cls:'daily-temp'},d.forecastMintemp.value+'° - '+d.forecastMaxtemp.value+'°'),
      el('div',{cls:'daily-rain'},psrText)
    )
    grid.appendChild(item)
  })
  mdw.appendChild(grid)
}

    var remBtn=el('button',{cls:'icon-button',ev:{click:function(){var ta=at();ta.favourites=ta.favourites.filter(function(x){return x.id!==f.id});delete M.etaMap[f.id];delete M.collapsed[f.id];renderBoard();saveAll()}}},'移除')

function fmtClock(eta){return eta?new Date(eta).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'}):'--'}

function renderFastest(){
  mfp.style.display='none';mfgg.innerHTML=''
  var t=at();if(!t||t.favourites.length<3)return
  var br={}
  t.favourites.forEach(function(f){
    var s=M.etaMap[f.id];if(!s||s.loading||s.error||!s.items||!s.items.length)return
    var first=s.items[0];if(!first||!first.eta)return
    if(!br[f.rt]||new Date(first.eta).getTime()<new Date(br[f.rt].eta).getTime())br[f.rt]={fid:f.id,rt:f.rt,snt:f.snt,on:f.on,eta:first.eta}
  })
  var sv=Object.values(br).sort(function(a,b){return new Date(a.eta).getTime()-new Date(b.eta).getTime()})
  if(sv.length<3)return
  mfp.style.display=''
  sv.slice(0,3).forEach(function(item,i){
    mfgg.appendChild(el('div',{cls:'fastest-card'},
      el('span',{cls:'fastest-rank'},'#'+(i+1)),
      el('strong',null,item.rt),
      el('span',null,item.snt),
      el('small',null,item.on+' · '+fmt(item.eta)+' · '+fmtClock(item.eta))
    ))
  })
}

// ---- ETA refresh ----
function refreshEtas(){
  var t=at();if(!t)return
  var hasFav=t.favourites&&t.favourites.length>0
  var hasTr=t.transfers&&t.transfers.length>0
  if(!hasFav&&!hasTr)return
  var tabId=t.id
  t.favourites.forEach(function(f){M.etaMap[f.id]=M.etaMap[f.id]||{};M.etaMap[f.id].loading=true;delete M.etaMap[f.id].error})
  renderFavourites()
  t.favourites.forEach(function(f){
    var fn=f.op==='kmb'?gt:gs
    var url=f.op==='kmb'?'https://data.etabus.gov.hk/v1/transport/kmb/eta/'+encodeURIComponent(f.sid)+'/'+encodeURIComponent(f.rt)+'/'+encodeURIComponent(f.stype):'https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/'+encodeURIComponent(f.sid)+'/'+encodeURIComponent(f.rt)
    var timedOut=false,timeoutId=setTimeout(function(){timedOut=true;M.etaMap[f.id]={loading:false,items:[],error:'請求逾時',ts:null};renderFavourites();if(at().favourites.length>=3)renderFastest()},10000)
    fn(url,function(err,r){
      if(timedOut||at().id!==tabId)return
      clearTimeout(timeoutId)
      if(err)M.etaMap[f.id]={loading:false,items:[],error:err.message,ts:null}
      else if(!r||!r.data)M.etaMap[f.id]={loading:false,items:[],error:null,ts:new Date().toISOString()}
      else{
        var items=r.data.filter(function(x){var ok=x.dir===dc(f.dir)&&x.eta;if(f.op==='kmb')ok=ok&&String(x.service_type)===f.stype;return ok}).sort(function(a,b){return a.eta_seq-b.eta_seq}).slice(0,3).map(function(x){return{eta:x.eta,seq:x.eta_seq,rt:x.rmk_tc||'',re:x.rmk_en||'',dt:x.dest_tc,de:x.dest_en}})
        M.etaMap[f.id]={loading:false,items:items,error:null,ts:new Date().toISOString()}
      }
      renderFavourites()
      if(at().favourites.length>=3)renderFastest()
    })
  })
  refreshTransferEtas()
}

      })

// ---- directions ----
function renderRouteSelected(){
  md.style.display='';mdr.innerHTML='';ms.style.display='none';M.selectedDir=null;M.stops=[];M.selectedStopId='';mab.disabled=true
  mdr.innerHTML='<span class="muted">載入方向中...</span>'
  var sr=M.selectedRoute
  if(sr.op==='kmb'){
    gt('https://data.etabus.gov.hk/v1/transport/kmb/route/',function(e,kmb){
      if(sr!==M.selectedRoute)return
      if(e){mdr.innerHTML='<span class="error-text">'+e.message+'</span>';return}
      var opts=kmb.data.filter(function(x){return x.route.toLowerCase()===sr.rt.toLowerCase()}).map(function(x){return{direction:bt(x.bound),directionCode:x.bound,serviceType:x.service_type,label:x.orig_tc+' -> '+x.dest_tc+(x.service_type!=='1'?'(特'+x.service_type+')':''),stopCount:0}})
      var seen={},out=[]
      opts.forEach(function(o){var k=o.direction+'-'+o.serviceType;if(!seen[k]){seen[k]=1;out.push(o)}})
      renderDirs(out)
    })
  }else{renderCtbDirs(sr.rt)}
}

function renderCtbDirs(rt){
  var dirs=[],p1=0,p2=0
  function check(){if(p1<2||p2<4)return;var out=dirs.filter(Boolean);renderDirs(out)}
  for(var i=0;i<2;i++){(function(idx){loadOne(idx===0?'outbound':'inbound')})(i)}
  function loadOne(dir){
    gs('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/'+encodeURIComponent(rt)+'/'+dir,function(e,cr){
      p1++;if(!cr||!cr.data||!cr.data.length){check();return}
      gs('https://rt.data.gov.hk/v2/transport/citybus/stop/'+encodeURIComponent(cr.data[0].stop),function(e2,fr){
        p2++
        gs('https://rt.data.gov.hk/v2/transport/citybus/stop/'+encodeURIComponent(cr.data[cr.data.length-1].stop),function(e3,lr){
          p2++
          var fn=fr&&fr.data?fr.data.name_tc:'起點'
          var ln=lr&&lr.data?lr.data.name_tc:'終點'
          var idx=dir==='outbound'?0:1
          dirs[idx]={direction:dir,directionCode:dir==='outbound'?'O':'I',serviceType:'1',label:fn+' -> '+ln,stopCount:cr.data.length}
          check()
        })
      })
    })
  }
}

function renderStops(){
  ms.style.display='';mst.innerHTML='<span class="muted">載入站點中...</span>';M.stops=[];M.selectedStopId='';mab.disabled=true;Q('stop-filter').value=''
  var sr=M.selectedRoute,sd=M.selectedDir

    gt(url1,function(e1,rs){

      gt('https://data.etabus.gov.hk/v1/transport/kmb/stop',function(e2,as){

        renderStopList()
      })

  }else{renderCtbStopList(sr.rt,sd.direction)}

function renderCtbStopList(rt,dir){
  gs('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/'+encodeURIComponent(rt)+'/'+encodeURIComponent(dir),function(e,cr){
    if(M.selectedRoute.rt!==rt||(M.selectedDir||{}).direction!==dir)return
    if(!cr||!cr.data){mst.innerHTML='';return}
    var out=[],cnt=0,don=false,total=cr.data.length
    cr.data.forEach(function(rec,i){
      gs('https://rt.data.gov.hk/v2/transport/citybus/stop/'+encodeURIComponent(rec.stop),function(e2,s){
        cnt++;out[i]={stopId:rec.stop,seq:rec.seq,nameTc:s&&s.data?s.data.name_tc:'站'+rec.stop,nameEn:s&&s.data?s.data.name_en:'Stop '+rec.stop}
        if(!don&&cnt>=total){don=true;M.stops=out;renderStopList()}
      })
    })
  })
}

// 揀路線(九巴+城巴合併搜尋)
function tfSearchRoutes(q, done){
  var all=[],seen={},c1=0,c2=0
  function check(){
    if(c1+c2<2)return
    all.sort(function(a,b){return a.rt.localeCompare(b.rt,'en',{numeric:true})})
    done(q?all.filter(function(i){return i.mt.indexOf(q.toLowerCase())!==-1}):all.slice(0,80))
  }
  gt('https://data.etabus.gov.hk/v1/transport/kmb/route/',function(e,kmb){
    c1=1
    if(!e&&kmb)kmb.data.forEach(function(r){var k='kmb:'+r.route;if(!seen[k]){seen[k]=1;all.push({op:'kmb',on:'九巴/龍運',rt:r.route,sm:r.orig_tc+' -> '+r.dest_tc,mt:(r.route+r.orig_tc+r.dest_tc+r.orig_en+r.dest_en).toLowerCase()})}})
    check()
  })
  gs('https://rt.data.gov.hk/v2/transport/citybus/route/CTB',function(e,ctb){
    c2=1
    if(ctb)ctb.data.forEach(function(r){var k='ctb:'+r.route;if(!seen[k]){seen[k]=1;all.push({op:'ctb',on:'城巴',rt:r.route,sm:r.orig_tc+' -> '+r.dest_tc,mt:(r.route+r.orig_tc+r.dest_tc+r.orig_en+r.dest_en).toLowerCase()})}})
    check()
  })
}

// 載入方向
function tfLoadDirs(rtOp,rt,cb){
  if(rtOp==='kmb'){
    gt('https://data.etabus.gov.hk/v1/transport/kmb/route/',function(e,kmb){
      if(e){cb([]);return}
      var opts=kmb.data.filter(function(x){return x.route.toLowerCase()===rt.toLowerCase()}).map(function(x){return{direction:bt(x.bound),directionCode:x.bound,serviceType:x.service_type,label:x.orig_tc+' -> '+x.dest_tc+(x.service_type!=='1'?'(特'+x.service_type+')':''),stopCount:0}})
      var seen={},out=[]
      opts.forEach(function(o){var k=o.direction+'-'+o.serviceType;if(!seen[k]){seen[k]=1;out.push(o)}})
      cb(out)
    })
  }else{
    var dirs=[],p1=0,p2=0
    function check(){if(p1<2||p2<4)return;cb(dirs.filter(Boolean))}
    for(var i=0;i<2;i++)(function(idx){loadOne(idx===0?'outbound':'inbound')})(i)
    function loadOne(dir){
      gs('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/'+encodeURIComponent(rt)+'/'+dir,function(e,cr){
        p1++;if(!cr||!cr.data||!cr.data.length){check();return}
        gs('https://rt.data.gov.hk/v2/transport/citybus/stop/'+encodeURIComponent(cr.data[0].stop),function(e2,fr){
          p2++
          gs('https://rt.data.gov.hk/v2/transport/citybus/stop/'+encodeURIComponent(cr.data[cr.data.length-1].stop),function(e3,lr){
            p2++
            var fn=fr&&fr.data?fr.data.name_tc:'起點'
            var ln=lr&&lr.data?lr.data.name_tc:'終點'
            var idx=dir==='outbound'?0:1
            dirs[idx]={direction:dir,directionCode:dir==='outbound'?'O':'I',serviceType:'1',label:fn+' -> '+ln,stopCount:cr.data.length}
            check()
          })
        })
      })
    }
  }
}

// 載入站點
function tfLoadStops(rtOp,rt,dir,stype,cb){
  if(rtOp==='kmb'){
    gt('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/'+encodeURIComponent(rt)+'/'+encodeURIComponent(dir)+'/'+encodeURIComponent(stype),function(e1,rs){
      if(e1){cb([]);return}
      gt('https://data.etabus.gov.hk/v1/transport/kmb/stop',function(e2,as){
        if(e2){cb([]);return}
        var sm={};as.data.forEach(function(s){sm[s.stop]={n:s.name_tc,e:s.name_en}})
        cb(rs.data.map(function(r){return{stopId:r.stop,seq:Number(r.seq),nameTc:sm[r.stop]?sm[r.stop].n:'站'+r.stop.slice(0,6),nameEn:sm[r.stop]?sm[r.stop].e:'Stop '+r.stop.slice(0,6)}}))
      })
    })
  }else{
    gs('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/'+encodeURIComponent(rt)+'/'+encodeURIComponent(dir),function(e,cr){
      if(!cr||!cr.data){cb([]);return}
      var out=[],cnt=0,don=false,total=cr.data.length
      cr.data.forEach(function(rec,i){
        gs('https://rt.data.gov.hk/v2/transport/citybus/stop/'+encodeURIComponent(rec.stop),function(e2,s){
          cnt++;out[i]={stopId:rec.stop,seq:rec.seq,nameTc:s&&s.data?s.data.name_tc:'站'+rec.stop,nameEn:s&&s.data?s.data.name_en:'Stop '+rec.stop}
          if(!don&&cnt>=total){don=true;cb(out)}
        })
      })
    })
  }
}

// 建立一個「路線 → 方向 → 站點」揀選器(轉乘用,每程一個)
function makeLegPicker(opts){
  // opts: {root, heading, hint, isB}
  var root=opts.root
  var P={root:root,q:'',routes:[],route:null,dirs:[],dir:null,stops:[],stopId:'',filter:'',matchOnly:opts.isB,busyRoute:false,busyDirs:false,busyStops:false,err:'',matchStopName:null,onChange:opts.onChange||function(){}}
  P.isB=!!opts.isB
  var timer=null

  function build(){
    var head=el('div',{cls:'picker-heading'},el('h3',null,opts.heading),opts.hint?el('p',{cls:'muted'},opts.hint):null)
    var lbl=el('label',{cls:'field'},el('span',null,'搜尋路線'),el('input',{type:'text',placeholder:'例如 1A、970、機場',ev:{input:function(){var v=this.value;clearTimeout(timer);timer=setTimeout(function(){P.q=v;doSearch()},300)}}}))
    P.resultsEl=el('div',{cls:'result-list'})
    P.noteEl=el('p',{cls:'muted picker-note',style:'display:none'})
    P.dirBlock=el('div',{cls:'section-block',style:'display:none'},el('h3',null,'方向'),P.dirsEl=el('div',{cls:'choice-list'}))
    P.stopBlock=el('div',{cls:'section-block',style:'display:none'},
      el('div',{cls:'section-title'},el('h3',null,'站點'),el('input',{type:'text',placeholder:'過濾站點',ev:{input:function(){P.filter=this.value;renderStops()}}})),
      P.matchWrap=el('label',{cls:'match-toggle',style:'display:none'},
        el('input',{type:'checkbox',checked:P.matchOnly,ev:{change:function(){P.matchOnly=this.checked;autoMatch();renderStops()}}}),
        P.matchLabel=el('span',null,'只顯示與第一程相同站名')),
      P.stopsEl=el('div',{cls:'stop-list'}))
    P.errEl=el('p',{cls:'error-text',style:'display:none'})
    root.appendChild(head);root.appendChild(lbl);root.appendChild(P.resultsEl);root.appendChild(P.noteEl);root.appendChild(P.dirBlock);root.appendChild(P.stopBlock);root.appendChild(P.errEl)
  }

  function setBusy(k,v){P['busy'+k]=v}

  function doSearch(){
    P.resultsEl.innerHTML=''
    if(!P.q.trim()){P.resultsEl.appendChild(el('p',{cls:'muted'},'搜尋路線...'));tfSearchRoutes('',function(r){P.routes=r;renderRoutes()});return}
    P.resultsEl.appendChild(el('p',{cls:'muted'},'搜尋中...'))
    tfSearchRoutes(P.q,function(r){P.routes=r;renderRoutes()})
  }

  function renderRoutes(){
    P.resultsEl.innerHTML=''
    var items=P.routes
    if(!items||!items.length){P.resultsEl.appendChild(el('p',{cls:'muted'},'冇符合嘅路線。'));return}
    items.forEach(function(it){
      var sel=P.route&&P.route.op===it.op&&P.route.rt===it.rt
      P.resultsEl.appendChild(el('button',{type:'button',cls:'result-card'+(sel?' selected':''),ev:{click:function(){P.route=it;P.dir=null;P.stops=[];P.stopId='';P.err='';renderRoutes();afterRoute()}}},el('strong',null,it.on+' '+it.rt),el('span',null,it.sm)))
    })
  }

  function afterRoute(){
    P.dirsEl.innerHTML=''
    P.dirBlock.style.display=''
    P.stopBlock.style.display='none'
    P.dirsEl.appendChild(el('p',{cls:'muted'},'載入方向中...'))
    tfLoadDirs(P.route.op,P.route.rt,function(dirs){
      P.dirs=dirs
      if(!dirs.length){P.dirsEl.innerHTML='';P.dirsEl.appendChild(el('p',{cls:'muted'},'呢條路線暫時冇方向資料。'));return}
      renderDirs()
    })
    report()
  }

  function renderDirs(){
    P.dirsEl.innerHTML=''
    P.dirs.forEach(function(d){
      var sel=P.dir&&P.dir.direction===d.direction&&P.dir.serviceType===d.serviceType
      P.dirsEl.appendChild(el('button',{type:'button',cls:'choice-chip'+(sel?' selected':''),ev:{click:function(){P.dir=d;P.stopId='';renderDirs();afterDir()}}},el('strong',null,d.label),el('span',null,(d.direction==='outbound'?'去程':'回程')+(d.serviceType!=='1'?'·班次'+d.serviceType:'')+(d.stopCount>0?'·'+d.stopCount+'站':''))))
    })
  }

  function afterDir(){
    P.stopBlock.style.display=''
    P.stopsEl.innerHTML=''
    P.stopsEl.appendChild(el('p',{cls:'muted'},'載入站點中...'))
    tfLoadStops(P.route.op,P.route.rt,P.dir.direction,P.dir.serviceType,function(stops){
      P.stops=stops
      autoMatch()
      renderStops()
      // 上報而家嘅揀選(自動揀中唯一同名站時,「加入」掣即刻可用)
      report()
    })
  }

  // 同名站處理:matchOnly 開啟且有 A 站名時,filter 至同名站;剩一個就自動揀埋
  function autoMatch(){
    if(P.isB&&P.matchOnly&&P.matchStopName){
      var same=P.stops.filter(function(s){return s.nameTc===P.matchStopName})
      P.noteEl.style.display=same.length?'none':''
      if(!same.length){
        P.noteEl.textContent='呢條路線冇站名完全相同嘅站,可以取消勾選「只顯示同名站」再手動揀最近嘅站。'
        P.stopId='';P.noteEl.style.display=''
        return
      }
      if(same.length===1){P.stopId=same[0].stopId}
      else if(!same.some(function(s){return s.stopId===P.stopId})){P.stopId=''}
    }
  }

  function visibleStops(){
    var list=P.stops
    if(P.isB&&P.matchOnly&&P.matchStopName)list=list.filter(function(s){return s.nameTc===P.matchStopName})
    var k=P.filter.trim().toLowerCase()
    if(!k)return list
    return list.filter(function(s){return (String(s.seq)+' '+s.nameTc+' '+s.nameEn).toLowerCase().indexOf(k)!==-1})
  }

  function renderStops(){
    P.stopsEl.innerHTML=''
    if(P.isB){P.matchWrap.style.display=P.matchStopName?'':'none';P.matchLabel.textContent=P.matchStopName?'只顯示與第一程相同站名「'+P.matchStopName+'」':'只顯示與第一程相同站名'}
    visibleStops().forEach(function(s){
      var sel=P.stopId===s.stopId
      var nameNode=el('span',{cls:'stop-name'},s.nameTc)
      if(P.isB&&P.matchStopName&&s.nameTc===P.matchStopName)nameNode.appendChild(el('em',{cls:'same-stop-tag'},'轉乘站'))
      P.stopsEl.appendChild(el('button',{type:'button',cls:'stop-row'+(sel?' selected':''),ev:{click:function(){P.stopId=s.stopId;P.err='';renderStops();report()}}},el('span',{cls:'stop-seq'},s.seq),nameNode))
    })
    if(!visibleStops().length&&P.stops.length)P.stopsEl.appendChild(el('p',{cls:'muted'},'冇符合條件嘅站點。'))
  }

  function report(){
    P.onChange(sel())
  }

  function sel(){
    if(!P.route||!P.dir)return null
    var s=P.stops.find(function(x){return x.stopId===P.stopId})
    if(!s)return null
    return{op:P.route.op,on:P.route.on,rt:P.route.rt,sm:P.route.sm,dir:P.dir.direction,dl:P.dir.label,stype:P.dir.serviceType,sid:s.stopId,snt:s.nameTc,sne:s.nameEn}
  }

  function setMatchStopName(n){
    P.matchStopName=n
    if(!P.isB)return
    if(n&&P.stops.length){autoMatch();renderStops()}
    report()
  }

  build()
  // expose
  P.afterRoute=afterRoute
  P.sel=sel
  P.setMatchStopName=setMatchStopName
  P.report=report
  // 初始搜尋(空 query 顯示全部前 80 條)
  doSearch()
  return P
}

// 由揀選器攞「完整 leg」record
function tfLegKey(leg){return leg?leg.op+':'+leg.rt+':'+leg.dir+':'+leg.stype+':'+leg.sid:''}

// ---------- 轉乘方塊渲染 ----------
function mergedRows(itemsA,itemsB){
  var combined=[]
  ;(itemsA||[]).slice(0,3).forEach(function(e,i){combined.push({leg:'A',eta:e,seq:i})})
  ;(itemsB||[]).slice(0,3).forEach(function(e,i){combined.push({leg:'B',eta:e,seq:i})})
  combined.sort(function(x,y){
    var d=new Date(x.eta.eta).getTime()-new Date(y.eta.eta).getTime()
    if(d!==0)return d
    return x.leg==='A'?-1:1
  })
  var prevATime=null
  return combined.map(function(row,index){
    var time=new Date(row.eta.eta).getTime()
    var gap=row.leg==='B'&&prevATime!==null?Math.max(0,Math.round((time-prevATime)/60000)):null
    if(row.leg==='A')prevATime=time
    return{key:row.leg+'-'+row.seq+'-'+index,leg:row.leg,eta:row.eta,gapMinutes:gap}
  })
}

  if(!loading&&stB.error)list.appendChild(el('p',{cls:'error-text'},'路線 '+tr.legB.rt+' 載入失敗:'+stB.error))

      el('div',{cls:'transfer-time-main'},el('strong',null,fmt(r.eta.eta)),el('span',null,fmtClock(r.eta.eta))))
    if(r.leg==='B'){
      if(r.gapMinutes!==null)timeSide.appendChild(el('span',{cls:'gap-badge gap-badge-value'},'與上一班 '+tr.legA.rt+' 相差 '+r.gapMinutes+' 分鐘'))
    }
    list.appendChild(el('div',{cls:'transfer-row'},el('div',{cls:'transfer-leg-col'},pill),mid,timeSide))
  })

  var footer=tr.legA.sm+' → 轉乘 → '+tr.legB.sm+(ts?' · 更新於 '+new Date(ts).toLocaleTimeString('zh-HK'):'')
  return el('div',{cls:'transfer-card'},head,list,el('p',{cls:'transfer-footer'},footer))
}

function refreshTransferEtas(){
  var t=at();if(!t||!t.transfers||!t.transfers.length)return
  var tabId=t.id
  t.transfers.forEach(function(tr){
    M.trEta=M.trEta||{}
    M.trEta[tr.id]=M.trEta[tr.id]||{}
    ;['a','b'].forEach(function(w){
      var st=M.trEta[tr.id][w]=M.trEta[tr.id][w]||{loading:false,items:[],error:null,ts:null}
      st.loading=true;st.error=null
    })
  })
  renderTransfers()
  t.transfers.forEach(function(tr){
    ;['a','b'].forEach(function(w){
      var leg=w==='a'?tr.legA:tr.legB
      var st=M.trEta[tr.id][w]
      var fn=leg.op==='kmb'?gt:gs
      var url=leg.op==='kmb'?'https://data.etabus.gov.hk/v1/transport/kmb/eta/'+encodeURIComponent(leg.sid)+'/'+encodeURIComponent(leg.rt)+'/'+encodeURIComponent(leg.stype):'https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/'+encodeURIComponent(leg.sid)+'/'+encodeURIComponent(leg.rt)
      var timedOut=false,timeoutId=setTimeout(function(){timedOut=true;st.loading=false;st.items=[];st.error='請求逾時';st.ts=null;renderTransfers()},10000)
      fn(url,function(err,r){
        if(timedOut||at().id!==tabId)return
        clearTimeout(timeoutId)
        if(err){st.loading=false;st.items=[];st.error=err.message;st.ts=null}
        else if(!r||!r.data){st.loading=false;st.items=[];st.error=null;st.ts=new Date().toISOString()}
        else{
          var items=r.data.filter(function(x){var ok=x.dir===dc(leg.dir)&&x.eta;if(leg.op==='kmb')ok=ok&&String(x.service_type)===leg.stype;return ok}).sort(function(a,b){return a.eta_seq-b.eta_seq}).slice(0,3).map(function(x){return{eta:x.eta,seq:x.eta_seq,rt:x.rmk_tc||'',re:x.rmk_en||'',dt:x.dest_tc,de:x.dest_en}})
          st.loading=false;st.items=items;st.error=null;st.ts=new Date().toISOString()
        }
        renderTransfers()
      })
    })
  })
}

function removeTransfer(id){
  var t=at();if(!t)return
  t.transfers=t.transfers.filter(function(x){return x.id!==id})
  if(M.trEta)delete M.trEta[id]
  saveAll()
  renderBoard()
  refreshEtas()
}

var pickA=null,pickB=null

function updateTransferAdd(){

  if(!sa&&!sb){status.textContent='先揀第一程路線嘅轉車站,再揀第二程路線。';btn.disabled=true;return}
  if(sa&&!sb){status.textContent='第一程:'+sa.on+' '+sa.rt+' @ '+sa.snt+' —— 而家揀第二程。';btn.disabled=true;return}
  if(!sa&&sb){status.textContent='仲未揀第一程路線嘅轉車站。';btn.disabled=true;return}
  if(tfLegKey(sa)===tfLegKey(sb)){status.textContent='第一程同第二程唔可以係同一程車。';btn.disabled=true;return}
  var dup=(at().transfers||[]).some(function(x){return tfLegKey(x.legA)+'>'+tfLegKey(x.legB)===tfLegKey(sa)+'>'+tfLegKey(sb)})
  if(dup){status.textContent='呢個轉乘組合已經加入咗。';btn.disabled=true;return}
  status.textContent=sa.on+' '+sa.rt+'（'+sa.snt+'）轉乘 '+sb.on+' '+sb.rt+'（'+sb.snt+'）'
  btn.disabled=false
}

function addTransferNow(){
  var t=at();if(!t)return
  var sa=pickA.sel(),sb=pickB.sel()
  if(!sa||!sb)return
  if(!t.transfers)t.transfers=[]
  var tr={id:uid(),legA:sa,legB:sb}
  t.transfers.push(tr)
  saveAll()
  renderBoard()
  refreshEtas()
  // 重設揀選器以便連續加入
  pickA.root.innerHTML='';pickB.root.innerHTML=''
  var ra=pickA.root,ca=pickA.cfg,rb=pickB.root,cb=pickB.cfg
  pickA=makeLegPicker(ca);pickB=makeLegPicker(cb)
  Q('transfer-status').textContent='已加入轉乘組合。可以再揀下一個。'
  Q('add-transfer-btn').disabled=true
}

function setBuilderMode(m){
  var stopBtn=Q('mode-stop-btn'),trBtn=Q('mode-transfer-btn')
  var stop=Q('stop-mode'),tr=Q('transfer-mode')
  if(m==='transfer'){
    stopBtn.className='mode-btn';trBtn.className='mode-btn active'
    stop.style.display='none';tr.style.display=''
    if(!M._transferReady)initTransferUI()
  }else{
    stopBtn.className='mode-btn active';trBtn.className='mode-btn'
    stop.style.display='';tr.style.display='none'
  }
}

function bindTransferModeButtons(){
  // mode buttons(啟動時即綁;揀站器延遲至首次入轉乘模式先建立)
  Q('mode-stop-btn').addEventListener('click',function(){setBuilderMode('stop')})
  Q('mode-transfer-btn').addEventListener('click',function(){setBuilderMode('transfer')})
}

function initTransferUI(){
  M._transferReady=true
  // pickers 容器
  var host=Q('transfer-pickers')
  var rootA=el('div',{cls:'picker-block'})
  var rootB=el('div',{cls:'picker-block'})
  host.appendChild(rootA);host.appendChild(rootB)
  var cfgA={root:rootA,heading:'第一程(轉乘起點)',hint:'揀轉車站:喺第一程落車嘅站',isB:false,onChange:function(sa){
    if(pickB)pickB.setMatchStopName(sa?sa.snt:null)
    updateTransferAdd()
  }}
  var cfgB={root:rootB,heading:'第二程(轉乘接駁)',hint:'揀完第一程站後,會自動只顯示同名站',isB:true,onChange:function(){updateTransferAdd()}}
  pickA=makeLegPicker(cfgA);pickA.cfg=cfgA
  pickB=makeLegPicker(cfgB);pickB.cfg=cfgB
  Q('add-transfer-btn').addEventListener('click',addTransferNow)
  updateTransferAdd()
}

// ---- persistence ----
 var _loaded=false
 function loadAll(){
   try{
     var r=localStorage.getItem('hk-bus-v5')
     if(r){var p=JSON.parse(r);if(p&&p.tabs&&p.tabs.length){M.tabs=p.tabs;M.activeTabId=p.activeTabId;if(p.collapsed)M.collapsed=p.collapsed;_loaded=true}}
   }catch(e){}
   if(!_loaded){
     try{
       var h=window.location.hash.slice(1)
       if(h){var p=JSON.parse(decodeURIComponent(h));if(p&&p.tabs&&p.tabs.length){M.tabs=p.tabs;M.activeTabId=p.activeTabId;if(p.collapsed)M.collapsed=p.collapsed;try{localStorage.setItem('hk-bus-v5',h)}catch(e){};_loaded=true}}
     }catch(e2){}
   }
   if(!_loaded){
     var defaultTab=defTab(1)
     M.tabs=[defaultTab]
     M.activeTabId=defaultTab.id
     _loaded=true
   }
   M.tabs.forEach(function(tb){if(!tb.transfers)tb.transfers=[]})
   var activeTab=M.tabs.find(function(x){return x.id===M.activeTabId})
   if(!activeTab&&M.tabs.length>0)M.activeTabId=M.tabs[0].id
   M._ready=true
   renderBoard()
   refreshEtas()
 }

 function saveAll(){
   if(!M.tabs||!M.tabs.length)return
   var data={tabs:M.tabs,activeTabId:M.activeTabId,collapsed:M.collapsed}
   var s=JSON.stringify(data)
   try{localStorage.setItem('hk-bus-v5',s)}catch(e){}
 }

// 确保 DOM 完全加载后再初始化
function init(){
  console.log('=== init 函数被调用 ===')
  loadAll()
  bindTransferModeButtons()
  setInterval(refreshEtas,30000)
  // 确保 DOM 完全加载后再加载天气数据和按钮事件
  setTimeout(function() {
    console.log('=== setTimeout 回调 ===')
    loadWeather()
    // 添加加载天气数据按钮事件
    var loadWeatherBtn = Q('load-weather-btn')
    if (loadWeatherBtn) {
      loadWeatherBtn.addEventListener('click', function() {
        console.log('手動載入天氣數據')
        loadWeather()
      })
    }
  }, 1000)
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', function(){
    init()
  })
}else{
  init()
}
})()
</script>
</div>
